version: 2

project_name: filu

builds:
  - main: ./cmd/filu
    binary: filu
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/vulcanshen/filu/internal/version.Version={{.Version}}
    goos:
      # unix-first — no windows target (GOOS=windows fails to compile by design)
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

# A formula, not a cask: filu is a CLI/TUI, so it belongs in a formula like the
# rest of the u-family (kbu). Homebrew stamps com.apple.quarantine on cask
# artifacts by default, which trips macOS Gatekeeper on an unsigned binary;
# formula binaries are never quarantined, so `brew install` runs clean.
brews:
  - repository:
      owner: vulcanshen
      name: homebrew-tap
      token: "{{ .Env.ACTION_TOKEN }}"
    homepage: "https://github.com/vulcanshen/filu"
    description: "ZLC terminal file manager (kbu u-family) — content search, split preview, carry-bucket"
    # Search (/) uses ripgrep for the content filter and fd for the file list;
    # declaring them as deps means `brew install filu` pulls them in too.
    dependencies:
      - name: ripgrep
      - name: fd
